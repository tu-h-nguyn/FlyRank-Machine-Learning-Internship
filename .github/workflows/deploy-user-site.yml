name: deploy-user-site

# Publishes docs/portfolio/ to https://tu-h-nguyn.github.io/ — the portfolio's own
# address. That address is served by a separate repository,
# tu-h-nguyn/tu-h-nguyn.github.io, which holds nothing but the output of
# work/scripts/export_user_site.py and is replaced wholesale on every publish.
#
# Needs one secret, USER_SITE_TOKEN: a fine-grained personal access token scoped
# to that one repository with Contents: read and write. Without it the job
# builds the site (so a broken export still fails here) and skips the push.

on:
  push:
    branches: [main]
    paths:
      - "docs/portfolio/**"
      - "docs/assets/**"
      - "work/portfolio/site.json"
      - "work/portfolio/site/**"
      - "work/scripts/build_portfolio.py"
      - "work/scripts/export_user_site.py"
      - ".github/workflows/deploy-user-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-user-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      USER_SITE_TOKEN: ${{ secrets.USER_SITE_TOKEN }}
      TARGET: tu-h-nguyn/tu-h-nguyn.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to publish pages that are stale against their sources
        run: |
          python3 work/scripts/make_project_figures.py --check
          python3 work/scripts/build_portfolio.py --check

      - name: Audit the pages before they go anywhere
        run: |
          python3 work/scripts/audit_portfolio.py
          python3 work/scripts/audit_launch.py

      - name: Build the site
        run: python3 work/scripts/export_user_site.py --out build/user-site

      - name: Publish to the user site
        if: env.USER_SITE_TOKEN != ''
        run: |
          set -e
          cd build/user-site
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish portfolio from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${USER_SITE_TOKEN}@github.com/${TARGET}.git" main
          echo "Published to https://github.com/${TARGET} — live at https://tu-h-nguyn.github.io/ in a minute or two."

      - name: Say why nothing was published
        if: env.USER_SITE_TOKEN == ''
        run: |
          echo "::notice::USER_SITE_TOKEN is not set, so the site was built but not published. See work/portfolio/GO-LIVE.md, section 0."
