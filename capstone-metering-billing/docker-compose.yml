services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healticheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/metering
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
