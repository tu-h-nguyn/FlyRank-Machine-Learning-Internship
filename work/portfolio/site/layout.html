<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="{{gsv}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="author" content="Nguyễn Hoàng Tú">
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">

  <!-- Social share preview -->
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:site_name" content="Nguyễn Hoàng Tú">
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{og_description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{og_image_alt}}">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{og_title}}">
  <meta name="twitter:description" content="{{og_description}}">
  <meta name="twitter:image" content="{{og_image}}">

  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">

{{analytics}}
{{jsonld}}
  <!-- Before first paint: the remembered theme (if any), and the .js class that arms the
       reveal styles. Without JavaScript neither runs and the page renders in place. -->
  <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')d.setAttribute('data-theme',t);}catch(e){}d.className+=' js';})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
{{css}}
  </style>
</head>
<body>

  <a class="skip" href="#main">Skip to content</a>

  <nav class="nav" aria-label="Site">
    <div class="nav-inner">
      <a class="brand" href="{{home}}" aria-label="Nguyễn Hoàng Tú — home">Hoàng Tú<b>.</b></a>
      <div class="nav-right">
        <div class="nav-links">
{{nav_links}}
        </div>
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
        <button class="icon-btn burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"></div>
  </nav>

  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu">
    <button class="icon-btn menu-close" type="button" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <nav aria-label="Menu">
{{menu_links}}
    </nav>
  </div>

  <main id="main">
{{body}}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-grid">
        <p class="footer-mark" aria-hidden="true">Hoàng Tú<b>.</b></p>
        <nav class="footer-links" aria-label="Elsewhere">
          <a href="https://github.com/tu-h-nguyn" target="_blank" rel="noopener">GitHub ↗</a>
          <a href="https://www.linkedin.com/in/tuhcmus/" target="_blank" rel="noopener">LinkedIn ↗</a>
          <a href="https://tu-h-nguyn.github.io/FlyRank-Machine-Learning-Internship/" target="_blank" rel="noopener">Research paper ↗</a>
          <a href="{{home_sections}}#contact">Contact</a>
        </nav>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Nguyễn Hoàng Tú</p>
        <p>Static HTML, no framework — <a href="https://github.com/tu-h-nguyn/FlyRank-Machine-Learning-Internship/tree/main/work/portfolio/site" target="_blank" rel="noopener">source</a></p>
      </div>
    </div>
  </footer>

{{page_js}}
  <script>
{{js}}
  </script>
</body>
</html>
